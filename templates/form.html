{% extends 'base.html' %}
{% block content %}
<nav class="navbar"><h2>Zona 2</h2><div><a href="{{ url_for('dashboard') }}">← Volver al Historial</a></div></nav>
<div class="container"><div class="card" style="max-width:500px; margin:0 auto;">
    <h3 style="margin-top:0;">{{ 'Corregir' if s else 'Nueva' }} Sesión</h3>
    <form method="POST">
        <label>Fecha de la sesión</label> <input type="date" name="fecha" value="{{ s.fecha_sesion if s else '' }}" required>
        <label>Actividad</label> 
        <select name="actividad" required>
            <option value="Trote" {% if s and s.tipo_actividad=='Trote' %}selected{% endif %}>Trote</option>
            <option value="Caminata" {% if s and s.tipo_actividad=='Caminata' %}selected{% endif %}>Caminata</option>
        </select>
        <label>Edad al realizar la sesión (años)</label> <input type="number" name="edad" min="18" value="{{ s.edad_sesion if s else '' }}" required>
        <label>Duración (minutos)</label> <input type="number" step="0.01" name="duracion" value="{{ s.duracion if s else '' }}" required>
        <label>Frecuencia cardíaca promedio (latidos/min)</label> <input type="number" step="0.01" name="promedio" value="{{ s.promedio if s else '' }}" required>
        <div style="display:flex; gap:10px; margin-top:20px;">
            <button type="submit" class="btn" style="flex:1;">Guardar</button>
            <a href="{{ url_for('dashboard') }}" class="btn" style="background:transparent; border:1px solid var(--text-muted); color:var(--text-main); flex:1;">Cancelar</a>
        </div>
    </form>
</div></div>
{% endblock %}
