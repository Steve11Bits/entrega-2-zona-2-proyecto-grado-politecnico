{% extends 'base.html' %}
{% block content %}
<nav class="navbar">
    <h2>Zona 2</h2>
    <div><a href="{{ url_for('dashboard') }}">Volver al Historial</a></div>
</nav>
<div class="container">
    <div class="card">
        <h3 style="margin-top: 0;">Registrar Nueva Sesión</h3>
        <form action="{{ url_for('add_session') }}" method="POST">
            <label>Fecha de la sesión</label> <input type="date" name="fecha" required>
            <label>Actividad</label> <select name="actividad" required><option value="Trote">Trote</option><option value="Caminata">Caminata</option></select>
            <label>Edad al realizar la sesión (años)</label> <input type="number" name="edad" min="18" required>
            <label>Duración (minutos)</label> <input type="number" step="0.01" name="duracion" required>
            <label>Frecuencia cardíaca promedio (latidos/min)</label> <input type="number" step="0.01" name="promedio" required>
            <button type="submit" class="btn">Guardar Sesión</button>
        </form>
    </div>
</div>
{% endblock %}
